name: simulation-offline
on: [push, pull_request, workflow_dispatch]
jobs:
  physics-and-contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned CPU simulation dependencies
        run: |
          python -m pip install -r requirements-sim.txt
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify assets, unit tests, and actual torque-driven locomotion
        env:
          GO2_SIM_PYTHON: python
        run: bash scripts/validate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locomotion-evidence
          path: .runtime/locomotion.json
