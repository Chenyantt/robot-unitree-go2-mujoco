urdf:
  path: ./.runtime/go2.urdf
  root_link: base_link
  model_name: go2_mujoco
robot:
  id: go2_mujoco
  display_name: Unitree Go2 Native MuJoCo
  family: quadruped
  root_part: chassis
  dimensions: {length_m: 0.75, width_m: 0.45, height_m: 0.5}
  footprint:
    base_frame: base_link
    points: [[0.4, 0.25], [0.4, -0.25], [-0.4, -0.25], [-0.4, 0.25]]
  components:
    - id: chassis
      type: mobile_base
      urdf_link: base_link
      exports:
        - provider_id: go2_sim_chassis
          capabilities:
            - {path: robonix/primitive/chassis/move}
            - {path: robonix/primitive/chassis/odom}
            - {path: robonix/primitive/chassis/twist_in}
    - id: lidar
      type: lidar_2d
      urdf_link: sim_lidar
      exports:
        - provider_id: go2_sim_lidar
          capabilities:
            - {path: robonix/primitive/lidar/lidar}
    - id: camera
      type: rgbd_camera
      urdf_link: sim_camera_optical
      exports:
        - provider_id: go2_sim_camera
          capabilities:
            - {path: robonix/primitive/camera/rgb}
            - {path: robonix/primitive/camera/depth}
            - {path: robonix/primitive/camera/intrinsics}
            - {path: robonix/primitive/camera/extrinsics}
    - id: imu
      type: imu
      urdf_link: imu
      exports:
        - provider_id: go2_sim_imu
          capabilities:
            - {path: robonix/primitive/imu/imu}
description:
  summary: Physics-driven Go2 walking with synthetic room sensors and isolated Robonix capabilities.
  can_do:
    - Native torque-driven quadruped locomotion and measured relative movements.
    - Publish RGB-D, planar rays, joint states, IMU, odometry and simulation TF.
  cannot_do:
    - Physical robot control or reproduction of Unitree proprietary sport firmware.
    - Claim a calibrated Go2 EDU payload, physical sensor noise or outdoor acceptance.
    - Autonomous mapping/navigation before their optional services are integrated and tested.
  notes:
    - URDF exports kinematic and inertial data; MJCF remains authoritative for visuals and contacts.
    - Footprint is a conservative planning envelope, not an exact vendor outline.
