<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go2 · MuJoCo 仿真</title>
<style>
body{font:17px system-ui;background:#f2f6fb;color:#183653;max-width:960px;margin:32px auto;padding:0 20px}
section{background:white;border:1px solid #dce5ef;border-radius:16px;padding:22px;margin:18px 0}
h1{font-size:30px}button{font:inherit;padding:12px 22px;margin:5px;border:0;border-radius:9px;background:#dcecff;touch-action:none}
#stop{background:#ffdad8}canvas{width:min(100%,640px);image-rendering:auto;border-radius:8px;background:#123}
pre{white-space:pre-wrap;font-size:15px}label{display:block;margin:12px}input{width:50%}
</style>
<h1>Robonix × Go2 · Native MuJoCo</h1>
<p>纯仿真 · 不连接真机 · 真实关节力矩与物理步进 · 虚拟前视 RGB-D</p>
<section><canvas id="camera" width="320" height="240"></canvas><p id="cameraStatus">等待相机</p></section>
<section>
<label>前进速度上限 <input id="speed" type="range" min="0.1" max="0.5" step="0.05" value="0.3"> <span id="speedValue">0.3 m/s</span></label>
<label>转向速度 <input id="yaw" type="range" min="0.1" max="0.6" step="0.1" value="0.4"> <span id="yawValue">0.4 rad/s</span></label>
<p>按住按钮移动，松开停止；页面掉线后速度指令自动过期。</p>
<button data-axis="2" data-sign="1">左转</button><button data-axis="0" data-sign="1">前进</button>
<button data-axis="2" data-sign="-1">右转</button><button data-axis="0" data-sign="-1">后退</button>
<button id="stop">停止</button><button id="reset">重置仿真</button>
<pre id="status">等待状态</pre><p id="error"></p>
</section>
<script>
const owner='web-'+Math.random().toString(36).slice(2);let held=null,busy=false;
const camera=document.getElementById('camera'),ctx=camera.getContext('2d');
async function command(body){try{const r=await fetch('/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const v=await r.json();document.getElementById('error').textContent=r.ok?'':v.error}catch(e){document.getElementById('error').textContent='连接中断';held=null}}
function stop(){held=null;command({stop:true})}
document.querySelectorAll('[data-axis]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);held=[+b.dataset.axis,+b.dataset.sign]};b.onpointerup=stop;b.onpointercancel=stop});
document.getElementById('stop').onclick=stop;document.getElementById('reset').onclick=()=>{held=null;command({reset:true})};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
for(const id of ['speed','yaw'])document.getElementById(id).oninput=e=>document.getElementById(id+'Value').textContent=e.target.value+(id==='speed'?' m/s':' rad/s');
setInterval(()=>{if(held){const v=[0,0,0];v[held[0]]=held[1]*+document.getElementById(held[0]===2?'yaw':'speed').value;command({owner,velocity:v})}},100);
async function update(){if(busy)return;busy=true;try{const s=await(await fetch('/state')).json();document.getElementById('status').textContent=JSON.stringify({ready:s.ready,time:s.time,position:s.position,velocity:s.linear_velocity,yaw_rate:s.angular_velocity?.[2],command:s.command},null,2);const r=await fetch('/camera');if(r.ok){const c=await r.json(),raw=atob(c.rgb),im=ctx.createImageData(c.width,c.height);for(let i=0;i<raw.length/3;i++){im.data[4*i]=raw.charCodeAt(3*i);im.data[4*i+1]=raw.charCodeAt(3*i+1);im.data[4*i+2]=raw.charCodeAt(3*i+2);im.data[4*i+3]=255}ctx.putImageData(im,0,0);document.getElementById('cameraStatus').textContent='仿真相机时间：'+c.time.toFixed(2)+' s'}}catch(e){document.getElementById('error').textContent='等待仿真服务'}finally{busy=false}}
setInterval(update,200);update();
</script></html>
